# gz-sim <-> ROS 2 bridge for the Z1 Gazebo simulation.
#
# The bridge keeps the Gazebo topic names on the ROS side as well, so that
# robot_state_publisher (/joint_states) works without remappings.
# Joint commands are plain floats: this path does NOT use ros2_control,
# it drives the gz JointPositionController servos directly.

- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS

- ros_topic_name: /joint_states
  gz_topic_name: /joint_states
  ros_type_name: sensor_msgs/msg/JointState
  gz_type_name: gz.msgs.Model
  direction: GZ_TO_ROS

- ros_topic_name: /joint1/cmd_pos
  gz_topic_name: /joint1/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ

- ros_topic_name: /joint2/cmd_pos
  gz_topic_name: /joint2/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ

- ros_topic_name: /joint3/cmd_pos
  gz_topic_name: /joint3/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ

- ros_topic_name: /joint4/cmd_pos
  gz_topic_name: /joint4/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ

- ros_topic_name: /joint5/cmd_pos
  gz_topic_name: /joint5/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ

- ros_topic_name: /joint6/cmd_pos
  gz_topic_name: /joint6/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ

- ros_topic_name: /jointGripper/cmd_pos
  gz_topic_name: /jointGripper/cmd_pos
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ

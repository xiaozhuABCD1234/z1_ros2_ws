# MoveIt joint limits.
# Velocities match the URDF (torqueMax/velocityMax in z1_description/urdf/const.xacro);
# accelerations are a conservative software default, the real controller limits
# are enforced by z1_controller.
joint_limits:
  joint1:
    has_velocity_limits: true
    max_velocity: 3.1415
    has_acceleration_limits: true
    max_acceleration: 3.0
  joint2:
    has_velocity_limits: true
    max_velocity: 3.1415
    has_acceleration_limits: true
    max_acceleration: 3.0
  joint3:
    has_velocity_limits: true
    max_velocity: 3.1415
    has_acceleration_limits: true
    max_acceleration: 3.0
  joint4:
    has_velocity_limits: true
    max_velocity: 3.1415
    has_acceleration_limits: true
    max_acceleration: 3.0
  joint5:
    has_velocity_limits: true
    max_velocity: 3.1415
    has_acceleration_limits: true
    max_acceleration: 3.0
  joint6:
    has_velocity_limits: true
    max_velocity: 3.1415
    has_acceleration_limits: true
    max_acceleration: 3.0
  jointGripper:
    has_velocity_limits: true
    max_velocity: 3.1415
    has_acceleration_limits: true
    max_acceleration: 3.0

# Controller mapping for MoveIt's simple controller manager.
# The actions are the ones provided by z1_bringup (ros2_control path).

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

# On the Gazebo path the arm runs the official torque law, whose integral gain is
# 0, so gravity leaves a static offset of ~0.001-0.021 rad behind the commanded
# pose. MoveIt's default start-state tolerance of 0.01 rad then rejects every
# execution with "start point deviates from current robot state".
trajectory_execution:
  allowed_start_tolerance: 0.05

moveit_simple_controller_manager:
  controller_names:
    - joint_trajectory_controller
    - gripper_controller

  joint_trajectory_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6

  gripper_controller:
    type: GripperCommand
    action_ns: gripper_cmd
    default: true
    joints:
      - jointGripper
